name: 发布应用

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: 检查格式
        run: cargo fmt --all -- --check

      - name: 运行测试
        run: cargo test --all-targets

      - name: 构建发布版本
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 准备发布文件
        shell: pwsh
        run: |
          $source = "target\x86_64-pc-windows-msvc\release\deepseek-harness-launcher.exe"
          $releaseDirectory = "dist"
          $destination = Join-Path $releaseDirectory "deepseek-harness-launcher.exe"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $size = (Get-Item -LiteralPath $destination).Length
          if ($size -gt 5MB) {
            throw "发布文件超过 5 MB：$size bytes"
          }
          Write-Output "发布文件大小：$size bytes"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-launcher-windows-x64
          path: dist/deepseek-harness-launcher.exe

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/deepseek-harness-launcher.exe --repo "${{ github.repository }}" --generate-notes
